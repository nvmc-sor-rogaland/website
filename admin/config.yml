backend:
  name: git-gateway
  repo: nvmc-sor-rogaland/website
  branch: master
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/33f9a476-5339-4a7c-93f1-747917f55add/pkce
  auth_token_endpoint: /sites/33f9a476-5339-4a7c-93f1-747917f55add/token
  gateway_url: https://gateway.decapbridge.com

  commit_messages:
    create: Create {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

media_folder: "assets/uploads"

collections:
  - name: "events"
    label: "Terminliste"
    folder: "_events/"
    create: true
    slug: "{{year}}"
    fields:
      - { name: "year", label: "År", widget: "number", value_type: "int" }
      - { name: "layout", label: "Layout", widget: "hidden", default: "page" }
      - { name: "title", label: "Tittel", widget: "string" }
      - { name: "subtitle", label: "Ingress", widget: "string" }
      - { name: "body", label: "Innhold", widget: "richtext", required: false }

auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url

logo_url: https://decapbridge.com/decapcms-with-bridge.svg

site_url: https://nvmc-sor-rogaland.github.io
